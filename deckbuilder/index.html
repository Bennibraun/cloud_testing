<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deckbuilder</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
  #main { flex: 1; overflow-y: auto; padding: 10px; }
  #side { width: 340px; overflow-y: auto; padding: 10px; border-left: 1px solid #ccc; }
  #form { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 6px; }
  #form input[type=text], #form input:not([type]) { width: 220px; }
  .results { display: flex; flex-wrap: wrap; gap: 6px; }
  .card { width: 146px; cursor: pointer; position: relative; }
  .card img { width: 146px; border-radius: 6px; }
  .card.owned::after { content: "owned"; position: absolute; top: 4px; right: 4px; background: #2a2; color: #fff; font-size: 11px; padding: 1px 4px; }
  .card button { position: absolute; bottom: 8px; left: 4px; font-size: 11px; }
  li { cursor: pointer; }
  li.owned { color: #2a2; }
  li:hover { text-decoration: line-through; }
  #edhrec li:hover { text-decoration: underline; }
  h3 { margin: 12px 0 4px; }
</style>
</head>
<body>
<div id="main">
  <div id="form">
    <input id="q" placeholder="Raw Scryfall query (optional)">
    <input id="name" placeholder="Name">
    <input id="oracle" placeholder="Rules text">
    <input id="type" placeholder="Types, e.g. legendary dinosaur">
    <span>Colors
      <select id="cop"><option value=">=">including</option><option value="=">exactly</option><option value="<=">at most</option></select>
      <label><input type="checkbox" class="col" value="w">W</label>
      <label><input type="checkbox" class="col" value="u">U</label>
      <label><input type="checkbox" class="col" value="b">B</label>
      <label><input type="checkbox" class="col" value="r">R</label>
      <label><input type="checkbox" class="col" value="g">G</label>
      <label><input type="checkbox" class="col" value="c">C</label>
    </span>
    <span>MV <select id="mvop"><option>=</option><option>&lt;=</option><option>&gt;=</option></select><input id="mv" type="number" min="0" style="width:4em"></span>
    <label><input type="checkbox" id="legal" checked> commander legal</label>
    <label><input type="checkbox" id="isCmd"> is commander</label>
    <label><input type="checkbox" id="inId" checked> within commander identity</label>
  </div>
  <code id="full"></code> <span id="status"></span>
  <h3>Owned (<span id="nOwned">0</span>)</h3>
  <div id="owned" class="results"></div>
  <h3>Not owned (<span id="nOther">0</span>)</h3>
  <div id="other" class="results"></div>
</div>
<div id="side">
  <h3>Commander: <span id="cmd">none</span></h3>
  <h3>Deck (<span id="count">0</span>)</h3>
  <ul id="deck"></ul>
  <button id="export">Copy decklist</button>
  <button id="clear">Clear deck</button>
  <h3>EDHREC <label style="font-weight:normal"><input type="checkbox" id="edhOwned" checked> owned only</label></h3>
  <div id="edhrec"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().trim();
let owned = new Set();
let deck = JSON.parse(localStorage.getItem('deck') || '{"commander":null,"identity":"","cards":[]}');
let edh = null;

const isOwned = name => owned.has(norm(name)) || owned.has(norm(name.split(' // ')[0]));

async function loadCollection() {
  const txt = await (await fetch('Cards.txt')).text();
  for (const line of txt.split('\n')) {
    const m = line.match(/^\s*\d+\s+(.+?)\s+\([^)]+\)/) || line.match(/^\s*\d+\s+(.+?)\s*$/);
    if (!m) continue;
    owned.add(norm(m[1]));
    owned.add(norm(m[1].split(' // ')[0]));
  }
  $('status').textContent = `${owned.size} owned names loaded`;
}

function save() { localStorage.setItem('deck', JSON.stringify(deck)); }

function renderDeck() {
  $('cmd').textContent = deck.commander || 'none';
  $('count').textContent = deck.cards.length + (deck.commander ? 1 : 0);
  $('deck').innerHTML = '';
  for (const name of [...deck.cards].sort()) {
    const li = document.createElement('li');
    li.textContent = name;
    li.className = isOwned(name) ? 'owned' : '';
    li.title = 'click to remove';
    li.onclick = () => { deck.cards = deck.cards.filter(n => n !== name); save(); renderDeck(); renderEdh(); };
    $('deck').appendChild(li);
  }
}

function addCard(name) {
  if (name !== deck.commander && !deck.cards.includes(name)) deck.cards.push(name);
  save(); renderDeck(); renderEdh();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function buildQuery() {
  const parts = [$('q').value.trim()];
  const quote = v => /\s/.test(v) ? `"${v}"` : v;
  if ($('name').value.trim()) parts.push(`name:${quote($('name').value.trim())}`);
  if ($('oracle').value.trim()) parts.push(`o:${quote($('oracle').value.trim())}`);
  for (const t of $('type').value.trim().split(/\s+/).filter(Boolean)) parts.push(`t:${t}`);
  const cols = [...document.querySelectorAll('.col:checked')].map(e => e.value).join('');
  if (cols) parts.push(`c${$('cop').value}${cols}`);
  if ($('mv').value !== '') parts.push(`mv${$('mvop').value}${$('mv').value}`);
  if ($('legal').checked) parts.push('f:commander');
  if ($('isCmd').checked) parts.push('is:commander');
  if ($('inId').checked && deck.commander) parts.push(`id<=${deck.identity || 'c'}`);
  return parts.filter(Boolean).join(' ');
}

let gen = 0;
const MAX_PAGES = 60, MAX_OTHER = 175;

async function search() {
  const my = ++gen;
  const q = buildQuery();
  $('full').textContent = q;
  $('owned').innerHTML = $('other').innerHTML = '';
  let nOwned = 0, nOther = 0;
  $('nOwned').textContent = $('nOther').textContent = 0;
  const onlyDefaults = q.split(' ').every(p => ['f:commander', 'is:commander'].includes(p) || p.startsWith('id<='));
  if (!q || onlyDefaults) { $('status').textContent = ''; return; }
  let url = 'https://api.scryfall.com/cards/search?unique=cards&order=edhrec&q=' + encodeURIComponent(q);
  let page = 0, total = 0;
  while (url && page < MAX_PAGES) {
    $('status').textContent = `loading page ${page + 1}...`;
    const r = await (await fetch(url)).json();
    if (my !== gen) return;
    if (r.object === 'error') { $('status').textContent = r.details; return; }
    total = r.total_cards;
    for (const c of r.data) {
      if (isOwned(c.name)) { $('owned').appendChild(cardEl(c)); nOwned++; }
      else if (nOther < MAX_OTHER) { $('other').appendChild(cardEl(c)); nOther++; }
    }
    $('nOwned').textContent = nOwned;
    $('nOther').textContent = nOther + (total - nOwned - nOther > 0 ? ` of ${total - nOwned}` : '');
    url = r.has_more ? r.next_page : null;
    page++;
    if (url) { await sleep(100); if (my !== gen) return; }
  }
  $('status').textContent = `${total} matches` + (url ? ` (scanned first ${MAX_PAGES} pages for owned cards, refine query)` : '');
}

let timer;
const searchSoon = () => { clearTimeout(timer); timer = setTimeout(search, 400); };

function cardEl(c) {
  const img = c.image_uris?.small || c.card_faces?.[0]?.image_uris?.small;
  const d = document.createElement('div');
  d.className = 'card' + (isOwned(c.name) ? ' owned' : '');
  d.innerHTML = `<img src="${img}" title="${c.name} (click to add)">`;
  d.onclick = () => addCard(c.name);
  if (/Legendary.*Creature|can be your commander/.test(c.type_line + (c.oracle_text || ''))) {
    const b = document.createElement('button');
    b.textContent = 'Set commander';
    b.onclick = e => { e.stopPropagation(); setCommander(c); };
    d.appendChild(b);
  }
  return d;
}

function slug(name) {
  return name.split(' // ')[0].normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9 -]/g, '').trim().replace(/[\s-]+/g, '-');
}

async function setCommander(c) {
  deck.commander = c.name;
  deck.identity = c.color_identity.join('').toLowerCase();
  deck.cards = deck.cards.filter(n => n !== c.name);
  save(); renderDeck();
  searchSoon();
  await loadEdh();
}

async function loadEdh() {
  edh = null;
  if (!deck.commander) return renderEdh();
  $('edhrec').textContent = 'loading...';
  const r = await fetch('edhrec/' + slug(deck.commander));
  if (!r.ok) { $('edhrec').textContent = 'EDHREC lookup failed'; return; }
  edh = (await r.json()).container.json_dict.cardlists;
  renderEdh();
}

function renderEdh() {
  const el = $('edhrec');
  el.innerHTML = '';
  if (!edh) return;
  const ownedOnly = $('edhOwned').checked;
  for (const list of edh) {
    const cards = list.cardviews.filter(c => !deck.cards.includes(c.name) && (!ownedOnly || isOwned(c.name)));
    if (!cards.length) continue;
    const h = document.createElement('h4');
    h.textContent = list.header;
    const ul = document.createElement('ul');
    for (const c of cards) {
      const li = document.createElement('li');
      li.className = isOwned(c.name) ? 'owned' : '';
      li.textContent = `${c.name} (${Math.round((c.synergy || 0) * 100)}% syn, ${Math.round(100 * c.num_decks / c.potential_decks)}% decks)`;
      li.title = 'click to add';
      li.onclick = () => addCard(c.name);
      ul.appendChild(li);
    }
    el.append(h, ul);
  }
}

$('form').oninput = searchSoon;
$('edhOwned').onchange = renderEdh;
$('clear').onclick = () => { deck = { commander: null, identity: '', cards: [] }; edh = null; save(); renderDeck(); renderEdh(); };
$('export').onclick = () => {
  const lines = (deck.commander ? [`1 ${deck.commander}`] : []).concat(deck.cards.sort().map(n => `1 ${n}`));
  navigator.clipboard.writeText(lines.join('\n'));
};

loadCollection().then(() => { renderDeck(); loadEdh(); });
</script>
</body>
</html>
